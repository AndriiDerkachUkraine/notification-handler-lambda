# Optional real MySQL for local runs: npm run db:up, then NOTIFICATION_STORE=mysql (see README).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notifications
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306" # 3307 to avoid clashing with a locally installed MySQL
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 3s
      retries: 20
